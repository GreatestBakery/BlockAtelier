<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title data-i18n="方块工坊 BlockAtelier">方块工坊 BlockAtelier</title>
<link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%237bc47f'/%3E%3Crect x='8' y='8' width='8' height='8' fill='%235fa864'/%3E%3C/svg%3E" rel="icon"/>
<link href="style.css" rel="stylesheet"/>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<header>
<div class="brand"><span class="cube"></span><span data-i18n="方块工坊">方块工坊</span><small class="brand-secondary">BlockAtelier</small></div>
<div class="hdr-right"><label class="inline language-control"><span data-i18n="语言">语言</span><select aria-label="Language / 语言" id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label>
<label class="inline"><span data-i18n="目标版本">目标版本</span><select id="version"></select></label>
<span class="badge" id="provider-badge"></span>
<button class="ghost" id="btn-settings"><span data-i18n="模型与渲染设置">模型与渲染设置</span></button>
</div>
</header>
<main>
<!-- 左: 创作输入 -->
<section class="panel" id="panel-input">
<div class="tabs" id="mode-tabs">
<button class="on" data-mode="text"><span data-i18n="文字 + 参考">文字 + 参考</span></button>
<button data-mode="model"><span data-i18n="3D 模型转换">3D 模型转换</span></button>
</div>
<div id="mode-text">
<label><span data-i18n="建筑描述">建筑描述</span><textarea data-i18n-placeholder="例：一座湖边的两层木构茶楼，深色云杉梁柱，青色歇山顶，带回廊和灯笼" id="prompt" placeholder="例：一座湖边的两层木构茶楼，深色云杉梁柱，青色歇山顶，带回廊和灯笼" rows="6"></textarea>
</label>
<label><span data-i18n="风格提示">风格提示</span><span class="hint"><span data-i18n="可选">可选</span></span>
<input data-i18n-placeholder="中世纪 / 蒸汽朋克 / 现代极简 …" id="style" placeholder="中世纪 / 蒸汽朋克 / 现代极简 …"/>
</label>
<label><span data-i18n="参考图">参考图</span><span class="hint"><span data-i18n="概念图、照片、设计图；需要支持看图的模型">概念图、照片、设计图；需要支持看图的模型</span></span>
<div class="drop" id="drop-images"><span data-i18n="点击或拖入图片">点击或拖入图片</span></div>
<input accept=".png,.jpg,.jpeg,.webp" hidden="" id="file-images" multiple="" type="file"/>
<div class="chips" id="chips-images"></div>
</label>
<label><span data-i18n="参考结构">参考结构</span><span class="hint"><span data-i18n="从右侧参考库勾选；不选则按关键词自动匹配">从右侧参考库勾选；不选则按关键词自动匹配</span></span>
<div class="chips" id="chips-refs"><span class="muted"><span data-i18n="参考库为空">参考库为空</span></span></div>
</label>
</div>
<div hidden="" id="mode-model">
<label><span data-i18n="3D 模型文件">3D 模型文件</span><span class="hint">.glb .gltf .obj .stl .ply</span>
<div class="drop" id="drop-model"><span data-i18n="点击或拖入模型">点击或拖入模型</span></div>
<input accept=".glb,.gltf,.obj,.stl,.ply,.off,.3mf,.dae" hidden="" id="file-model" type="file"/>
</label>
<div class="row">
<label><span data-i18n="最长边（方块）">最长边（方块）</span><input id="vox-size" max="256" min="8" type="number" value="48"/></label>
<label><span data-i18n="朝上的轴">朝上的轴</span><select id="vox-up"><option value="auto"><span data-i18n="自动">自动</span></option><option value="y">Y</option><option value="z">Z</option></select>
</label>
</div>
<label><span data-i18n="配色用的方块范围">配色用的方块范围</span><select id="vox-palette"></select></label>
<label class="check"><input id="vox-solid" type="checkbox"/><span data-i18n="填充内部（默认只保留外壳）">填充内部（默认只保留外壳）</span></label>
<label><span data-i18n="换材质说明">换材质说明</span><span class="hint"><span data-i18n="可选，交给模型把配色映射成指定材质">可选，交给模型把配色映射成指定材质</span></span>
<textarea data-i18n-placeholder="例：整体做成风化的砂岩遗迹，屋顶用深色板岩" id="model-prompt" placeholder="例：整体做成风化的砂岩遗迹，屋顶用深色板岩" rows="3"></textarea>
</label>
</div>
<div id="size-row">
<label><span data-i18n="尺寸上限">尺寸上限</span><span class="hint"><span data-i18n="东西 × 高 × 南北">东西 × 高 × 南北</span></span></label>
<div class="row three">
<input id="size-x" max="256" min="4" type="number" value="32"/>
<input id="size-y" max="256" min="4" type="number" value="32"/>
<input id="size-z" max="256" min="4" type="number" value="32"/>
</div>
</div>
<button class="primary" id="btn-generate"><span data-i18n="生成">生成</span></button>
<div hidden="" id="iterate-box">
<div class="sep"></div>
<label><span data-i18n="在当前作品上修改">在当前作品上修改</span><span class="hint"><span data-i18n="保留原指令，按说明改">保留原指令，按说明改</span></span>
<textarea data-i18n-placeholder="例：屋顶改成红色，正面加一个带栏杆的阳台" id="iterate-prompt" placeholder="例：屋顶改成红色，正面加一个带栏杆的阳台" rows="3"></textarea>
</label>
<button id="btn-iterate"><span data-i18n="生成修改版">生成修改版</span></button>
</div>
</section>
<!-- 中: 视图 + 流程 -->
<section id="center">
<div id="viewport">
<canvas id="canvas"></canvas>
<div id="vp-empty"><span data-i18n="还没有作品。在左侧写一段描述，或上传一个 3D 模型。">还没有作品。在左侧写一段描述，或上传一个 3D 模型。</span></div>
<div id="vp-tools">
<button class="ghost small" id="vp-reset"><span data-i18n="重置视角">重置视角</span></button>
<button class="ghost small" id="vp-spin"><span data-i18n="自动旋转">自动旋转</span></button>
</div>
<div id="vp-title"></div>
</div>
<div class="panel" id="detail">
<div class="tabs" id="detail-tabs">
<button class="on" data-tab="flow"><span data-i18n="流程">流程</span></button>
<button data-tab="report"><span data-i18n="校验报告">校验报告</span></button>
<button data-tab="materials"><span data-i18n="用料清单">用料清单</span></button>
<button data-tab="program"><span data-i18n="建筑指令">建筑指令</span></button>
<button data-tab="renders"><span data-i18n="渲染与导出">渲染与导出</span></button>
</div>
<div class="tab" id="tab-flow"><ol id="timeline"><li class="muted"><span data-i18n="每一步的进展会显示在这里。">每一步的进展会显示在这里。</span></li></ol></div>
<div class="tab" hidden="" id="tab-report"></div>
<div class="tab" hidden="" id="tab-materials"></div>
<div class="tab" hidden="" id="tab-program"><pre id="program-json"></pre></div>
<div class="tab" hidden="" id="tab-renders"></div>
</div>
</section>
<!-- 右: 作品库 + 参考库 -->
<section class="panel" id="panel-library">
<div class="tabs" id="lib-tabs">
<button class="on" data-lib="builds"><span data-i18n="作品库">作品库</span></button>
<button data-lib="refs"><span data-i18n="参考库">参考库</span></button>
</div>
<div id="lib-builds">
<div class="row">
<input data-i18n-placeholder="搜索标题 / 描述 / 标签" id="lib-q" placeholder="搜索标题 / 描述 / 标签"/>
<button class="ghost small" data-i18n-title="只看收藏" id="lib-fav" title="只看收藏">★</button>
</div>
<div id="build-list"></div>
</div>
<div hidden="" id="lib-refs">
<p class="hint"><span data-i18n="放入你收集的 .litematic / .schem / .nbt 或参考图。结构文件会被解析成尺寸和用料摘要，生成时提供给模型。">放入你收集的 .litematic / .schem / .nbt 或参考图。结构文件会被解析成尺寸和用料摘要，生成时提供给模型。</span></p>
<div class="drop" id="drop-refs"><span data-i18n="点击或拖入参考文件">点击或拖入参考文件</span></div>
<input accept=".litematic,.schem,.schematic,.nbt,.png,.jpg,.jpeg,.webp" hidden="" id="file-refs" multiple="" type="file"/>
<label class="check"><input id="ref-as-build" type="checkbox"/><span data-i18n="结构文件同时入作品库（可预览、转格式、渲染）">结构文件同时入作品库（可预览、转格式、渲染）</span></label>
<div id="ref-list"></div>
</div>
</section>
</main>
<dialog id="dlg-settings">
<form method="dialog">
<h2><span data-i18n="模型与渲染设置">模型与渲染设置</span></h2>
<div class="grid2">
<label><span data-i18n="模型提供方">模型提供方</span><select id="cfg-provider"></select></label>
<label><span data-i18n="模型名">模型名</span><input data-i18n-placeholder="填你账号里可用的模型名" id="cfg-model" placeholder="填你账号里可用的模型名"/></label>
<label class="wide" id="cfg-opencode-row" hidden><span data-i18n="opencode 可执行文件">opencode 可执行文件</span><input id="cfg-opencode" placeholder="opencode"/></label>
<label class="wide" id="cfg-codex-row" hidden><span data-i18n="Codex 可执行文件">Codex 可执行文件</span><input id="cfg-codex" placeholder="codex"/></label>
<label class="wide"><span data-i18n="接口地址">接口地址</span><span class="hint"><span data-i18n="留空用预设">留空用预设</span></span><input id="cfg-base" placeholder=""/></label>
<label class="wide">API Key <span class="hint" id="cfg-key-hint"></span><input autocomplete="off" data-i18n-placeholder="留空表示不修改" id="cfg-key" placeholder="留空表示不修改" type="password"/></label>
<label><span data-i18n="校验失败时修复轮数">校验失败时修复轮数</span><input id="cfg-repair" max="5" min="0" type="number"/></label>
<label><span data-i18n="看图自评轮数">看图自评轮数</span><input id="cfg-critique" max="3" min="0" type="number"/></label>
<label class="check wide"><input id="cfg-vision" type="checkbox"/><span data-i18n="模型支持看图（参考图、渲染自评）">模型支持看图（参考图、渲染自评）</span></label>
<label class="wide"><span data-i18n="SearXNG 地址">SearXNG 地址</span><span class="hint"><span data-i18n="可选，联网找参考">可选，联网找参考</span></span><input id="cfg-searx" placeholder="http://localhost:8080"/></label>
<label class="wide"><span data-i18n="Blender 可执行文件">Blender 可执行文件</span><span class="hint" id="cfg-blender-hint"></span><input id="cfg-blender" placeholder="blender"/></label>
</div>
<p class="hint" id="cfg-note"></p>
<div class="row end">
<button class="ghost" value="cancel"><span data-i18n="取消">取消</span></button>
<button class="primary" id="cfg-save" value="default"><span data-i18n="保存">保存</span></button>
</div>
</form>
</dialog>
<div hidden="" id="toast"></div>
<script src="app.js" type="module"></script>
</body>
</html>
